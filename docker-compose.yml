services:
  micromail:
    image: grimmdev/micromail:latest
    container_name: micromail
    restart: unless-stopped
    ports:
      - "8080:8080"   # Webmail & Addon Store HTTP UI
      - "25:25"       # Inbound SMTP
      - "587:587"     # Authenticated SMTP Submission
      - "993:993"     # IMAPS (IMAP over TLS)
    volumes:
      - ./data:/data
    environment:
      - HTTP_PORT=8080
      - MAIL_DOMAIN=${MAIL_DOMAIN:-example.com}
      - MAIL_HOSTNAME=${MAIL_HOSTNAME:-mail.example.com}
